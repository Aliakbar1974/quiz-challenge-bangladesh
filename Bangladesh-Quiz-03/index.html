<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>বাংলাদেশ বিষয়াবলি MCQ Challenge 03</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="start-screen">

    <div class="top-badge">
      MCQ
    </div>

    <h1>বাংলাদেশ বিষয়াবলি</h1>

    <h2>
      MCQ Challenge <span>03</span>
    </h2>

    <div class="info-box">

      <div>
        <strong>৩০টি প্রশ্ন</strong>
      </div>

      <div>
        <strong>Learning / Exam Mode</strong>
      </div>

    </div>

    <p class="instruction">
      একটি মোড নির্বাচন করে শুরু করুন
    </p>

    <div class="mode-buttons">

      <button id="learningBtn"
              class="mode-btn learning">
        📖 LEARNING MODE
      </button>

      <button id="examBtn"
              class="mode-btn exam">
        ⏱ EXAM MODE
      </button>

    </div>

    <p id="status" class="status"></p>

  </main>

  <script src="script.js"></script>

</body>
</html>
